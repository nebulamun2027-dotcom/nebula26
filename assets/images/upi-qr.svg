<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1c2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#060612;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8f7bff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#b7a9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8f7bff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0a12"/>
  
  <!-- Subtle grid -->
  <rect width="1920" height="1080" fill="url(#bgPattern)" opacity="0.05"/>
  
  <!-- QR Code container -->
  <g id="qrContainer" transform="translate(360, 240)">
    <rect width="1000" height="1000" fill="#05030a"/>
    
    <!-- Quiet zones -->
    <rect x="40" y="40" width="80" height="80" fill="#14121e"/>
    <rect x="780" y="40" width="80" height="80" fill="#14121e"/>
    <rect x="40" y="780" width="80" height="80" fill="#14121e"/>
    
    <!-- Finder patterns -->
    <rect x="55" y="55" width="50" height="50" fill="#1a1c2e"/>
    <rect x="55" y="55" width="40" height="40" fill="#14121e"/>
    <rect x="65" y="65" width="20" height="20" fill="#2a2e3a"/>
    
    <rect x="760" y="55" width="50" height="50" fill="#1a1c2e"/>
    <rect x="760" y="55" width="40" height="40" fill="#14121e"/>
    <rect x="770" y="65" width="20" height="20" fill="#2a2e3a"/>
    
    <rect x="55" y="760" width="50" height="50" fill="#1a1c2e"/>
    <rect x="55" y="760" width="40" height="40" fill="#14121e"/>
    <rect x="65" y="770" width="20" height="20" fill="#2a2e3a"/>
    
    <!-- Data modules pattern (simplified QR pattern) -->
    <g fill="#14121e">
      <!-- Pattern rows -->
      <rect x="70" y="70" width="10" height="10"/>
      <rect x="90" y="70" width="10" height="10"/>
      <rect x="110" y="70" width="10" height="10"/>
      <rect x="130" y="70" width="10" height="10"/>
      <rect x="150] y="70" width="10" height="10"/>
      <rect x="170] y="70" width="10" height="10"/>
      <rect x="70] y="90" width="10" height="10"/>
      <rect x="90] y="90" width="10" height="10"/>
      <rect x="110] y="90" width="10" height="10"/>
      <rect x="130] y="90" width="10" height="10"/>
      <rect x="150] y="90" width="10" height="10"/>
      <rect x="170] y="90" width="10" height="10"/>
      <!-- ... more cells for pattern density -->
    </g>
    
    <!-- Center alignment pattern -->
    <circle cx="500" cy="500" r="25" fill="#1a1c2e"/>
    <circle cx="500" cy="500" r="15" fill="#14121e"/>
    <circle cx="500" cy="500" r="8" fill="#2a2e3a"/>
    
    <!-- UPI Symbol in center -->
    <circle cx="500" cy="500" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="500" cy="500" r="45" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="40 20"/>
    
    <!-- UPI Symbol "पे" -->
    <text x="500" y="515" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">पे</text>
  </g>
  
  <!-- Decorative outer elements -->
  <circle cx="1400" cy="200" r="200" fill="url(#accentGrad)" opacity="0.08"/>
  <circle cx="500" cy="900" r="250" fill="url(#accentGrad)" opacity="0.06"/>
  <circle cx="1700" cy="850" r="150" fill="url(#accentGrad)" opacity="0.05"/>
  
</svg>